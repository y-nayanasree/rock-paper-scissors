
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <div class="badge">💎 MINI GAME</div>
        <h1>Rock Paper Scissors</h1>
        <p class="subtitle">Choose your move and challenge the computer!</p>

        <section class="scoreboard">
            <div class="score-card">
                <span>YOU</span>
                <strong id="playerScore">0</strong>
            </div>
            <div class="vs">VS</div>
            <div class="score-card">
                <span>COMPUTER</span>
                <strong id="computerScore">0</strong>
            </div>
        </section>

        <h2>Choose your move</h2>

        <div class="choices">
            <button class="choice" data-choice="rock" aria-label="Choose Rock">
                <span>✊</span>
                <small>Rock</small>
            </button>
            <button class="choice" data-choice="paper" aria-label="Choose Paper">
                <span>✋</span>
                <small>Paper</small>
            </button>
            <button class="choice" data-choice="scissors" aria-label="Choose Scissors">
                <span>✌️</span>
                <small>Scissors</small>
            </button>
        </div>

        <section class="result-box" aria-live="polite">
            <p id="status">Make your first move!</p>
            <div class="moves">
                <span>You: <strong id="playerMove">—</strong></span>
                <span>Computer: <strong id="computerMove">—</strong></span>
            </div>
        </section>

        <p id="roundCount">Rounds played: 0</p>
        <button id="resetBtn" class="reset-btn">↻ Reset Game</button>

        <p class="footer">Built with HTML, CSS & JavaScript 💜</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
