
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <div class="badge">💎 MINI GAME</div>
        <h1>Rock Paper Scissors</h1>
        <p class="subtitle">Ready? Let's play together!</p>

        <section class="scoreboard">
            <div class="score">
                <span>YOU</span>
                <strong id="playerScore">0</strong>
            </div>
            <div class="vs">VS</div>
            <div class="score">
                <span>COMPUTER</span>
                <strong id="computerScore">0</strong>
            </div>
        </section>

        <button id="startBtn" class="start-btn">▶ Start Game</button>

        <div id="countdown" class="countdown" aria-live="polite">
            Click Start Game!
        </div>

        <h2>Choose your move</h2>

        <div class="choices">
            <button class="choice" data-choice="rock" disabled>
                <span>✊</span><small>Rock</small>
            </button>
            <button class="choice" data-choice="paper" disabled>
                <span>✋</span><small>Paper</small>
            </button>
            <button class="choice" data-choice="scissors" disabled>
                <span>✌️</span><small>Scissors</small>
            </button>
        </div>

        <section class="result">
            <h2 id="status">Your game starts here!</h2>
            <div class="moves">
                <div>
                    <p>Your Choice</p>
                    <strong id="playerMove">❔</strong>
                </div>
                <div>
                    <p>Computer Choice</p>
                    <strong id="computerMove">❔</strong>
                </div>
            </div>
        </section>

        <p id="roundCount">Rounds played: 0</p>

        <button id="playAgainBtn" class="again-btn" disabled>
            ↻ Play Again
        </button>
        <button id="resetBtn" class="reset-btn">Reset Score</button>

        <p class="footer">Built with HTML, CSS & JavaScript 💜</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
